<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | GhumauneyNepal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">
        <nav class="main-nav">

            <a class="logo" href="index.html">
                <img src="ll.png" alt="GhumauneyNepal logo">
            </a>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="destinations.html">Destinations</a></li>
                <li><a href="packages.html">Packages</a></li>
                <li><a href="hotels.html">Hotels</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>

        </nav>
    </header>

    <main>
        <section class="section">

            <div class="section-heading">
                <span>WELCOME BACK</span>
                <h1>Login to GhumauneyNepal</h1>
                <p>Login to continue planning your Nepal journey.</p>
            </div>

            <div class="planner-card" style="max-width: 500px; margin: 0 auto;">

                <form id="loginForm">

                    <label class="field">
                        <span>Email</span>
                        <input
                            type="email"
                            id="loginEmail"
                            required
                            placeholder="Enter your email"
                        >
                    </label>

                    <br>

                    <label class="field">
                        <span>Password</span>
                        <input
                            type="password"
                            id="loginPassword"
                            required
                            placeholder="Enter your password"
                        >
                    </label>

                    <button type="submit" class="btn" style="margin-top: 20px;">
                        Login
                    </button>

                    <div
                        id="loginMessage"
                        role="status"
                        aria-live="polite"
                        style="margin-top: 15px;"
                    ></div>

                </form>

                <p style="margin-top: 20px;">
                    Don't have an account?
                    <a href="register.html">Register here</a>
                </p>

            </div>

        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-brand">
            <h3>GhumauneyNepal</h3>
            <p>One Platform. Every Journey. Every Budget.</p>
        </div>
    </footer>

    <script>
        const loginForm = document.getElementById("loginForm");
        const loginMessage = document.getElementById("loginMessage");

        loginForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const email = document.getElementById("loginEmail").value;
            const password = document.getElementById("loginPassword").value;

            loginMessage.textContent = "Logging in...";

            try {
                const response = await fetch(
                    "Backend/auth/login.php",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/x-www-form-urlencoded"
                        },
                        body: new URLSearchParams({
                            email: email,
                            password: password
                        })
                    }
                );

                const data = await response.json();

                if (data.success) {
                    loginMessage.textContent = "Login successful!";

                    window.location.href = "index.html";
                } else {
                    loginMessage.textContent = data.message;
                }

            } catch (error) {
                console.error(error);
                loginMessage.textContent =
                    "Unable to connect to the server.";
            }
        });
    </script>

</body>
</html>
